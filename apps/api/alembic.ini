# Alembic 설정.
# DB URL은 alembic/env.py가 app.core.config.settings.SQLALCHEMY_DATABASE_URI에서 읽어 덮어쓴다.
# 파일에 직접 시크릿을 두지 않는다.

[alembic]
script_location = alembic
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(slug)s
prepend_sys_path = .
sqlalchemy.url = driver://override-by-env-py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
