# mcp.smap.site — SMAP MCP 서버 리버스 프록시
#
# MCP Streamable HTTP는 응답 일부를 SSE(Server-Sent Events)로 흘려보냅니다.
# nginx 기본값(proxy_buffering on)은 응답을 모아서 한 번에 보내므로
# 스트리밍이 클라이언트에 도달하지 않고 요청이 타임아웃된 것처럼 보입니다.
# 아래 버퍼링·타임아웃 설정이 이 프록시의 핵심입니다.

server {
    listen 80;
    server_name mcp.smap.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.smap.site;

    # 인증서 경로는 기존 smap.site 설정과 동일한 위치를 사용합니다.
    ssl_certificate     /etc/letsencrypt/live/smap.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smap.site/privkey.pem;

    access_log /var/log/nginx/mcp-access.log;
    error_log  /var/log/nginx/mcp-error.log;

    # MCP 요청 본문은 작습니다. 상한을 낮게 잡아 남용을 줄입니다.
    client_max_body_size 1m;

    location /mcp {
        proxy_pass http://127.0.0.1:5126;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 연결이 Connection: close로 끊기지 않도록 비웁니다.
        proxy_set_header Connection        "";

        # --- SSE 스트리밍에 필수 ---
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 긴 스트림이 중간에 끊기지 않도록 넉넉히 잡습니다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5126;
        proxy_set_header Host $host;
        access_log off;
    }

    # 그 외 경로는 노출하지 않습니다.
    location / {
        return 404;
    }
}
