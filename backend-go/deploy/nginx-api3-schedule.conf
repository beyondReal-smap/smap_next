# api3.smap.site 의 `server { listen 443 ssl ... }` 블록 안에 추가할 location 스니펫.
# (기존 `location / { proxy_pass http://127.0.0.1:9000; }` 위/아래 아무 곳이나 — nginx는 최장 prefix 우선)
#
# 목적: /schedule(단수) 도메인 7종만 Go(9200)로 보낸다. 나머지는 그대로 Python(9000).
#
# ⚠️ 트레일링 슬래시 필수: `/api/v1/schedule/` 는 `/api/v1/schedules`(복수, 별도 라우터)를
#    매칭하지 않는다. 슬래시를 빼면 /schedules 까지 Go로 가버리므로 반드시 슬래시 포함.
# ⚠️ proxy_pass 끝에 URI(슬래시) 없음 → 원본 경로(/api/v1/schedule/...)가 그대로 9200에 전달된다.

location ^~ /api/v1/schedule/ {
    proxy_pass http://127.0.0.1:9200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Phase A owner-schedules 응답이 최대 ~557KB라 버퍼를 api3 기존값과 동일하게 둔다.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}
